[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omega"
version = "0.1.0"
description = "Omega is a terminal-based coding agent powered by Gemini."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "google-genai==1.12.1",
    "pydantic-settings>=2.13.1",
    "python-dotenv==1.1.0",
    "rich>=13.7.0",
    "prompt_toolkit>=3.0.43",
    "pyfiglet>=1.0.2",
]

[project.scripts]
omega = "omega.main:main"

[tool.setuptools]
package-dir = { "omega" = "." }
packages = ["omega", "omega.functions", "omega.agent_tools"]
